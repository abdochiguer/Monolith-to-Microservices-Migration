# =============================================================================
# Job : Migration one-shot des données historiques (demo-db → vet-db)
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-historical-vets
  namespace: default
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrator
          image: postgres:18.4
          env:
            - name: PGPASSWORD_SOURCE
              valueFrom:
                secretKeyRef:
                  name: demo-db
                  key: password
            - name: PGPASSWORD_TARGET
              value: "vetpass"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              SRC="demo-db.default.svc.cluster.local"
              DST="vet-db.microservices.svc.cluster.local"

              echo "=== Migration historique des vétérinaires ==="

              PGPASSWORD="$PGPASSWORD_SOURCE" pg_dump \
                -h "$SRC" -U user -d petclinic \
                --data-only --inserts \
                -t vets -t specialties -t vet_specialties \
                --file=/tmp/historical-vets.sql

              sed '/^SET transaction_timeout = /d' \
                /tmp/historical-vets.sql > /tmp/historical-vets-pg16.sql

              PGPASSWORD="$PGPASSWORD_TARGET" psql \
                -X --no-psqlrc --single-transaction --set=ON_ERROR_STOP=1 \
                -h "$DST" -U vetuser -d vetdb \
                -c "TRUNCATE TABLE vet_specialties, vets, specialties RESTART IDENTITY" \
                --file=/tmp/historical-vets-pg16.sql

              echo "=== Vérification ==="
              SRC_COUNTS=$(PGPASSWORD="$PGPASSWORD_SOURCE" psql \
                -h "$SRC" -U user -d petclinic -XAt \
                -c "SELECT (SELECT count(*) FROM vets) || ':' || (SELECT count(*) FROM specialties) || ':' || (SELECT count(*) FROM vet_specialties)")
              DST_COUNTS=$(PGPASSWORD="$PGPASSWORD_TARGET" psql \
                -h "$DST" -U vetuser -d vetdb -XAt \
                -c "SELECT (SELECT count(*) FROM vets) || ':' || (SELECT count(*) FROM specialties) || ':' || (SELECT count(*) FROM vet_specialties)")

              echo "Source (vets:specialties:vet_specialties): $SRC_COUNTS"
              echo "Cible  (vets:specialties:vet_specialties): $DST_COUNTS"
              test "$SRC_COUNTS" = "$DST_COUNTS"
